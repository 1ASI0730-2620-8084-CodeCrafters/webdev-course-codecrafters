<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página personal</title>
</head>
<body>
  <h1>Mi página personal</h1>
  <p>Me gusta aprender, jugar y cuidar a los animales.</p>

  <!-- h2 crea un subtítulo para cada sección -->
  <h2>Mis pasatiempos</h2>

  <!-- ul crea la lista y cada li es un elemento de la lista -->
  <ul>
    <li>Jugar videojuegos</li>
    <li>Escuchar música</li>
    <li>Cuidar a los animales</li>
  </ul>

  <!-- src indica la ubicación y alt describe la imagen -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Black_dog.jpg/500px-Black_dog.jpg"
       alt="Un perro labrador negro."
       width="300"
       height="400"
  >

  <!-- href indica el destino del enlace y target="_blank" lo abre en una pestaña nueva -->
  <p>
    <a href="https://www.wikipedia.org/" target="_blank">Explorar Wikipedia</a>
  </p>
</body>
</html>
